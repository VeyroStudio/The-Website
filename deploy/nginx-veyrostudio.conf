# ---------------------------------------------------------------
# Nginx site config for veyrostudio.co.uk on a Hostinger VPS.
#
# Nginx answers on 80/443 and passes everything to the Next.js server
# on localhost:3000, which PM2 keeps alive.
#
# Install:
#   sudo cp nginx-veyrostudio.conf /etc/nginx/sites-available/veyrostudio
#   sudo ln -s /etc/nginx/sites-available/veyrostudio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) — it rewrites this file to add the
# 443 block and the certificate paths.
# ---------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name veyrostudio.co.uk www.veyrostudio.co.uk;

    # Sensible upload ceiling — nothing here accepts files, but this
    # stops a malformed request tying up a worker.
    client_max_body_size 2M;

    # Let Nginx compress what it proxies. Next already serves its own
    # assets efficiently; this catches the HTML.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Next's hashed build output is immutable — let browsers keep it.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Photographs and icons out of /public
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Security headers. No CSP here — add one only after checking it
    # against the inline scripts Next emits, or you will white-screen
    # the site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
